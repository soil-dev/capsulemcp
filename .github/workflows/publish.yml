# Stages a tagged release on npm with a provenance attestation, using
# npm Trusted Publishing (OIDC) — no npm token is stored anywhere — and
# npm staged publishing: the version only goes live when a maintainer
# approves it with 2FA (`npm stage approve <stage-id>`).
#
# Run it ON THE RELEASE TAG:
#
#   gh workflow run publish.yml -R soil-dev/capsulemcp --ref vX.Y.Z -f dist-tag=latest
#
# The run's ref is what npm writes into the provenance (source ref and
# commit), so dispatching on the tag makes the attestation name the tag
# and its commit. Any other ref fails the first step.
#
# Why staged: with plain trusted publishing, anyone who can push a `v*`
# tag and dispatch this workflow could publish. Staging means the
# workflow can only upload; making a version public still needs a human
# with the package's npm 2FA. The "latest only moves forwards" check
# runs against what is live at staging time: approve only the newest
# pending stage and reject older ones (HOWTO.md, step 6).
#
# Two jobs. `build` installs dependencies, runs the test suite and packs
# the tarball WITHOUT the OIDC permission; `stage` holds `id-token:
# write`, installs nothing and runs no repository code, and stages
# exactly the tarball `build` produced and tested.
#
# One-time setup (repository + npm), in this order:
#   1. Tag protection — Settings → Rules → Rulesets → New tag ruleset,
#      target `v*`, restrict creations, updates and deletions, bypass for
#      repository admins only.
#   2. Environment — Settings → Environments → New environment `npm`:
#      Deployment branches and tags → "Selected" → add tag rule `v*`.
#   3. npm trusted publisher, staging only (prompts for 2FA). First
#      `npm trust list capsulemcp`, and `npm trust revoke capsulemcp
#      --id=<id>` any existing entry — one with publish permission would
#      let this workflow skip the approval. Then:
#        npm trust github capsulemcp --repo soil-dev/capsulemcp \
#          --file publish.yml --env npm --allow-stage-publish
#   4. npmjs.com → package capsulemcp → Settings → Publishing access →
#      "Require two-factor authentication and disallow tokens".
#
# publishConfig.provenance in package.json only guards against an
# accidental workstation publish (`--provenance=false` overrides it); the
# controls that matter are 2FA approval and consumers checking the
# attestation's identity — repository, workflow and tag — as INSTALL.md
# describes.

name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag: latest for X.Y.Z, beta for X.Y.Z-beta.N, next for X.Y.Z-rc.N"
        required: true
        default: latest
        type: choice
        options: [latest, beta, next]

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

# An explicit `shell: bash` runs steps with `-eo pipefail`; the implicit
# default is plain `bash -e`, under which `npm stage publish … | tee`
# would report success even if staging failed.
defaults:
  run:
    shell: bash

jobs:
  build:
    name: build + test ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Dispatched on a release tag, with a matching dist-tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::dispatch this workflow on the release tag: gh workflow run publish.yml --ref vX.Y.Z (got $REF_TYPE '$TAG')"
            exit 1
          fi
          n='(0|[1-9][0-9]*)'
          if ! printf '%s' "$TAG" | grep -Eq "^v$n\.$n\.$n(-(beta|rc)\.$n)?\$"; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z, vX.Y.Z-beta.N, vX.Y.Z-rc.N; no leading zeros)"
            exit 1
          fi
          case "$TAG" in
            *-beta.*) want=beta ;;
            *-rc.*) want=next ;;
            *) want=latest ;;
          esac
          if [ "$DIST_TAG" != "$want" ]; then
            echo "::error::$TAG must be published with dist-tag '$want', not '$DIST_TAG'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout is the tagged commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::checked-out commit $(git rev-parse HEAD) is not the run's commit $GITHUB_SHA"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: package.json version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p 'require("./package.json").version')
          if [ "v$v" != "$TAG" ]; then
            echo "::error::package.json version $v does not match tag $TAG"
            exit 1
          fi

      # Only the latest release line is supported (SECURITY.md), so a
      # stable release must never move `latest` backwards for every
      # unpinned `npx -y capsulemcp` user.
      - name: latest only moves forwards
        if: inputs.dist-tag == 'latest'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # capsulemcp is already published, so a failed lookup is a
          # registry/network problem — stop rather than skip the check.
          current=$(npm view capsulemcp dist-tags.latest)
          node -e '
            const [mine, cur] = [process.argv[1].replace(/^v/, ""), process.argv[2]];
            if (!cur) { console.error("could not read the current latest version"); process.exit(1); }
            const a = mine.split(".").map(Number), b = cur.split(".").map(Number);
            for (let i = 0; i < 3; i++) {
              if (a[i] > b[i]) process.exit(0);
              if (a[i] < b[i]) break;
            }
            console.error("refusing to move latest from " + cur + " to " + mine);
            process.exit(1);
          ' "$TAG" "$current"

      # --ignore-scripts: no dependency lifecycle script runs in the
      # release pipeline (the Dockerfile and CI install the same way).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Runtime dependencies only: a dev-only advisory must not block an
      # urgent security release.
      - run: npm audit --audit-level=high --omit=dev

      - name: Pack
        run: |
          npm pack --ignore-scripts --json \
            | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{const p=JSON.parse(s)[0];console.log(p.filename+" "+p.integrity+" sha1:"+p.shasum)})'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: capsulemcp-*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: stage ${{ github.ref_name }} on npm (${{ inputs.dist-tag }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm Trusted Publisher is bound to this environment, and the
    # environment is limited to v* tags (see the setup notes above).
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: npm supports staged trusted publishing (>= 11.15.0)
        run: |
          node -e '
            const v = process.argv[1];
            const [a, b] = v.split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) {
              console.error("npm " + v + " is too old for staged publishing (need >= 11.15.0)");
              process.exit(1);
            }
          ' "$(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball

      - name: Stage
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          npm stage publish ./capsulemcp-*.tgz --provenance --access public --tag "$DIST_TAG" | tee stage.log
          {
            echo "### Staged — awaiting 2FA approval"
            echo
            echo '```'
            cat stage.log
            echo '```'
            echo
            echo "Check it with \`npm stage view <stage-id>\` (integrity must match the build job's Pack line; \`npm stage download <stage-id>\` fetches the tarball),"
            echo "then approve with \`npm stage approve <stage-id>\` (prompts for 2FA). Approve only the newest pending stage: \`npm stage list capsulemcp\`, and \`npm stage reject\` older ones."
          } >> "$GITHUB_STEP_SUMMARY"
